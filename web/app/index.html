<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Phice">
<title>Phice</title>

<!-- A floor under the design. Comes first, so every rule the Mac's theme
     defines still overrides it. Its only job is that the pad is never invisible:
     all styling used to come from the Mac, so a theme that had not arrived (or
     never arrived) left real, working buttons painted black on black with
     nothing on screen to say why. -->
<style id="fallback">
  #pad{position:relative;height:calc(100% - 12%);margin:0 8px}
  .btn{position:absolute;display:flex;align-items:center;justify-content:center;
       background:#1c2530;color:#9fb3c8;border:1px solid #38485a;border-radius:22px;
       font:600 15px/1 -apple-system,system-ui,sans-serif}
  .btn[data-pressed="1"]{background:#2c3d4f}
  .role-scroll{background:#141c25;border-radius:999px}
  .role-power{background:#10161d;border:1px solid #1e2731;border-radius:999px}
</style>

<!-- The Mac's theme, pushed over the data channel and replaced wholesale. -->
<style id="theme"></style>

<!-- This page's own chrome. It must NEVER be replaced: the theme used to
     overwrite it, which deleted the rule that shows the Start button, so motion
     access could not be granted and the phone sent no orientation at all.
     It comes after #theme so it wins any tie. -->
<style id="shell">
  /* The pairing chrome follows the appearance chosen on the Mac. Before a
     connection exists there is nothing to ask, so it falls back to the phone's
     own setting; once the Mac tells us, data-appearance overrides it.
     Paper first; anthracite when dark. The code field is a recessed slot, the
     Connect key is the one orange thing on the screen. */
  :root{--sh-bg:#ece9e2;--sh-fg:#2b2a27;--sh-dim:#7d786e;--sh-field:#d6d2c8;
       --sh-line:#c9c4b8;--sh-accent:#f26b21;--sh-ink:#ffffff;--sh-accent-edge:#d45a17;
       --sh-accent-shade:#bf4f12;--sh-sink:inset 0 1px 2px rgba(0,0,0,.18);--sh-warn:#d9a441}
  @media (prefers-color-scheme: dark){
    :root:not([data-appearance="light"]){--sh-bg:#2a2b2a;--sh-fg:#e4e2dc;--sh-dim:#9a978f;
      --sh-field:#222322;--sh-line:#454643;--sh-sink:inset 0 1px 2px rgba(0,0,0,.45)}
  }
  :root[data-appearance="light"]{--sh-bg:#ece9e2;--sh-fg:#2b2a27;--sh-dim:#7d786e;
    --sh-field:#d6d2c8;--sh-line:#c9c4b8;--sh-sink:inset 0 1px 2px rgba(0,0,0,.18)}
  :root[data-appearance="dark"]{--sh-bg:#2a2b2a;--sh-fg:#e4e2dc;--sh-dim:#9a978f;
    --sh-field:#222322;--sh-line:#454643;--sh-sink:inset 0 1px 2px rgba(0,0,0,.45)}
  html,body{height:100%;margin:0;background:var(--sh-bg);color:var(--sh-fg);
            font:16px "Helvetica Neue",Helvetica,Arial,system-ui,sans-serif;
            touch-action:none;-webkit-user-select:none;user-select:none;
            transition:background 200ms ease-out,color 200ms ease-out}
  .screen{position:fixed;inset:0;z-index:10;display:none;
          align-items:center;justify-content:center;
          padding:24px;text-align:center;background:var(--sh-bg);
          transition:background 200ms ease-out}
  body[data-screen="pair"] #screen-pair,
  body[data-screen="connecting"] #screen-connecting,
  body[data-screen="failed"] #screen-failed,
  body[data-screen="start"] #screen-start{display:flex}
  .screen h1{font-size:15px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;
             margin:0 0 10px}
  #code{font-size:30px;font-weight:500;letter-spacing:.28em;padding:14px 14px 14px calc(14px + .28em);
        font-variant-numeric:tabular-nums;text-align:center;width:100%;
        background:var(--sh-field);color:var(--sh-fg);border:1px solid var(--sh-line);
        border-radius:6px;box-shadow:var(--sh-sink);text-transform:uppercase;outline:none}
  #code:focus{border-color:var(--sh-dim)}
  .screen button{font:inherit;font-size:15px;font-weight:600;letter-spacing:.02em;
                 padding:13px 30px;margin-top:18px;
                 border:1px solid var(--sh-accent-edge);border-radius:6px;
                 background:var(--sh-accent);color:var(--sh-ink);
                 box-shadow:0 2px 0 var(--sh-accent-shade),0 3px 6px rgba(40,35,25,.15);
                 transition:transform 80ms linear,box-shadow 80ms linear}
  .screen button:active{transform:translateY(2px);box-shadow:none}
  .screen p{color:var(--sh-dim);line-height:1.5;font-size:14px}
  #haptic{position:fixed;width:1px;height:1px;opacity:0;pointer-events:none;
          left:-9999px;top:0}
  /* Connecting. Three rings leaving the centre, one after another: it takes a
     few seconds to find a Mac across networks, and a still screen for that long
     is indistinguishable from a stuck one. */
  .pulse{position:relative;width:96px;height:96px;margin:0 auto 22px}
  .pulse i{position:absolute;inset:0;border-radius:50%;border:2px solid var(--sh-accent);
           opacity:0;animation:pulse 2.4s cubic-bezier(.22,.61,.36,1) infinite}
  .pulse i:nth-child(2){animation-delay:.8s}
  .pulse i:nth-child(3){animation-delay:1.6s}
  .pulse::after{content:"";position:absolute;left:50%;top:50%;width:12px;height:12px;
                margin:-6px 0 0 -6px;border-radius:50%;background:var(--sh-accent);
                box-shadow:0 0 8px var(--sh-accent);
                animation:breathe 2.4s ease-in-out infinite}
  @keyframes pulse{
    0%{transform:scale(.18);opacity:0}
    12%{opacity:.85}
    100%{transform:scale(1);opacity:0}
  }
  @keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(.72)}}
  @media (prefers-reduced-motion: reduce){
    .pulse i,.pulse::after{animation:none}
    .pulse i:first-child{opacity:.4;transform:scale(1)}
  }
  #link-note{position:fixed;left:0;right:0;bottom:8px;z-index:11;text-align:center;
             font-size:12px;color:var(--sh-warn);margin:0}
  body[data-link="unstable"] #link-note{display:block}
  body:not([data-link="unstable"]) #link-note{display:none}
</style>

<body data-screen="pair" data-state="disconnected">
  <main id="pad" aria-label="Mouse controls"></main>

  <p id="link-note" hidden>Connection unstable…</p>

  <!-- Safari has never implemented the Vibration API. The only lever is a
       switch-style checkbox, which taps the Taptic Engine when it flips, and
       WebKit only honours a click that arrives through the label. -->
  <label id="haptic" aria-hidden="true"><input type="checkbox" switch tabindex="-1"></label>

  <div class="screen" id="screen-pair">
    <div>
      <h1>Phice</h1>
      <p>Enter the six-character code shown on your Mac.</p>
      <input id="code" maxlength="6" autocapitalize="characters" autocomplete="off"
             autocorrect="off" spellcheck="false" inputmode="text">
      <button type="button" id="btn-pair">Connect</button>
    </div>
  </div>

  <div class="screen" id="screen-connecting">
    <div>
      <div class="pulse" aria-hidden="true"><i></i><i></i><i></i></div>
      <h1>Connecting…</h1>
      <p>Finding your Mac</p>
    </div>
  </div>

  <div class="screen" id="screen-start">
    <div>
      <h1>Connected</h1>
      <p>Tap to allow motion access.</p>
      <button type="button" id="btn-start">Start</button>
    </div>
  </div>

  <div class="screen" id="screen-failed">
    <div>
      <h1>Could not connect</h1>
      <p id="why"></p>
      <button type="button" id="btn-retry">Try again</button>
    </div>
  </div>

  <!-- Loaded through a bootstrap with a cache-busting query rather than a plain
       src. iOS caches this page aggressively -- a Home Screen web app has its own
       store and does not revalidate reliably -- so a phone can keep running a
       client from days ago while the Mac has moved on, and every symptom of that
       looks like a transport bug. The file is 20KB; fetching it fresh costs
       nothing next to the hours that skew has cost. -->
  <script>
    (function () {
      var s = document.createElement("script");
      s.src = "/app/app.js?t=" + Date.now();
      document.body.appendChild(s);
    })();
  </script>
</body>
